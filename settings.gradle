pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
    }
}

plugins {
    // Auto-provisions the JDK 25 toolchain for compilation if none is installed locally.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "economycraft"
